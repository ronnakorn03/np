<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>สุขสันต์วันเกิดพ่อ</title>

  <style>
    body {
      text-align: center;
      font-family: "Sarabun", Arial, sans-serif;
      background: linear-gradient(to right, #ffecd2, #fcb69f);
      overflow-x: hidden;
    }

    .card {
      background: white;
      padding: 25px;
      margin: 50px auto;
      width: 340px;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      position: relative;
      z-index: 2;
      overflow: hidden;
    }

    h1 {
      margin-bottom: 5px;
    }

    button {
      padding: 10px 20px;
      margin: 6px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
    }

    #gallery img {
      width: 100%;
      max-width: 100%;
      height: auto;
      margin-top: 12px;
      display: none;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    #message {
      margin-top: 18px;
      padding: 18px;
      color: #d6336c;
      font-weight: 500;
      min-height: 100px;
      background: #fff0f3;
      border: 2px solid #ff6b6b;
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      line-height: 1.8;
      text-align: left;
      word-break: keep-all;
      overflow-wrap: normal;
    }

    .letter-header {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .letter-line {
      margin-bottom: 6px;
    }

    .letter-footer {
      margin-top: 15px;
      text-align: right;
      font-size: 14px;
      opacity: 0.9;
    }

    .heart {
      position: fixed;
      bottom: 0;
      font-size: 20px;
      animation: floatUp 3s linear forwards;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-600px); opacity: 0; }
    }
  </style>
</head>

<body>

<audio id="bgm" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <h1>HAPPY BIRTHDAY</h1>
  <p>NAM PHET ❤️</p>

  <button onclick="surprise()">กดที่นี่เพื่อดูจดหมาย ❤️</button>
  <br>

  <button onclick="startAll()">กดตรงนี้เพื่อดูเซอร์ไพรส์ 🎉</button>

  <div id="message"></div>

  <div id="gallery">
    <img src="img1.jpg">
    <img src="img2.jpg">
    <img src="img3.jpg">
    <img src="img4.jpg">
    <img src="img5.jpg">
    <img src="img6.jpg">
    <img src="img7.jpg">
  </div>
</div>

<script>
  let images;
  let slideInterval;
  let heartInterval;
  let typingInterval;
  let isPlaying = false;

  window.onload = function() {
    images = document.querySelectorAll("#gallery img");
  }

  function typeMessageHTML(html) {
    const el = document.getElementById("message");
    el.innerHTML = "";

    let index = 0;
    clearInterval(typingInterval);

    typingInterval = setInterval(() => {
      el.innerHTML = html.slice(0, index);
      index++;

      if (index >= html.length) {
        clearInterval(typingInterval);
      }
    }, 25);
  }

  // ❤️ กดแล้ว "มีเพลง + หยุดเอฟเฟกต์"
  function surprise() {
    const audio = document.getElementById("bgm");

    // ▶️ เล่นเพลงถ้ายังไม่เล่น
    if (audio.paused) {
      audio.volume = 0.4;
      audio.play();
    }

    // ⛔ หยุดเอฟเฟกต์ (แต่ไม่หยุดเพลง)
    clearInterval(slideInterval);
    clearInterval(heartInterval);
    isPlaying = false;

    const letter = `
      <div class="letter-header">ถึงน้ำเพชร ❤️</div>

      <div class="letter-line">มีความสุขมากๆนะครับ</div>
      <div class="letter-line">ขอให้เธอยิ้มเย้อๆเยยยย</div>
      <div class="letter-line">ขอให้เป้น16 ที่ดีน้าาา</div>

      <br>

      <div class="letter-line">ขอให้สุขภาพแข็งแรง มีความสุขมาก ๆ</div>
      <div class="letter-line">สุขสมหวังกับทุกเรื่อง เราซัพพอร์ตเธอเสมอ ❤️</div>

      <div class="letter-footer">จาก อัศวินขี้แอค </div>
    `;

    typeMessageHTML(letter);
  }

  function startAll() {
    if (!isPlaying) {
      document.getElementById("bgm").play();
      createHearts();
      startSlideshow();
      isPlaying = true;
    } else {
      document.getElementById("bgm").pause();
      clearInterval(slideInterval);
      clearInterval(heartInterval);
      isPlaying = false;
    }
  }

  function createHearts() {
    heartInterval = setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (20 + Math.random() * 20) + "px";

      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 3000);
    }, 300);
  }

  function startSlideshow() {
    let index = 0;

    slideInterval = setInterval(() => {
      images.forEach(img => img.style.display = "none");
      images[index].style.display = "block";
      index = (index + 1) % images.length;
    }, 2000);
  }
</script>

</body>
</html>
